[project]
name = "openvidia"
version = "2.1.0"
description = "NVIDIA NIM multi-key proxy with smart rate limiting, cooldown management, and desktop dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx[http2]>=0.27",
    "psutil>=6.0",
    "pywebview>=5.0",
    "PyGObject>=3.42; platform_system=='Linux'",
    "pycairo>=1.20; platform_system=='Linux'",
    "PyQt6>=6.5; platform_system=='Linux'",
    "PyQt6-WebEngine>=6.5; platform_system=='Linux'",
    "qtpy>=2.4; platform_system=='Linux'",
    "tomlkit>=0.13",
]
license = "MIT"
authors = [{ name = "Ciro Autuori" }]
keywords = ["nvidia", "nim", "proxy", "rate-limiting", "api-gateway", "opencode", "desktop"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]

# Contributor tooling: `uv sync` installs these automatically, so a fresh
# clone can run `uv run pytest` without hunting for the right packages.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[project.scripts]
openvidia = "openvidia.__main__:main"

# Multi-node sync is opt-in: redis-py stays out of the base install so the
# proxy has zero extra deps for its default standalone mode.
[project.optional-dependencies]
redis = ["redis>=5.0"]

[tool.setuptools.packages.find]
include = ["openvidia*"]

# The dashboard bundle ships inside the package. It used to live at the repo
# root, where packages.find could not see it, so every non-editable install —
# the Arch package, `pip install openvidia`, any real deployment — got a proxy
# with no UI and no /health endpoint (which is defined inside attach_webui, and
# was therefore also missing). It only ever worked because install.sh uses
# `uv sync` / `pip install -e`, which run from the source tree.
[tool.setuptools.package-data]
openvidia = ["web/*", "web/assets/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Beyond the defaults (E,F): import order, modern syntax, likely bugs, and
# needless complexity. Enforced in CI and by the pre-commit hook, so style
# stops being something a reviewer has to notice by hand.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "E501",    # line length is the formatter's job, not a review comment
    "SIM105",  # contextlib.suppress reads worse than try/except pass here
    "B008",    # FastAPI's Depends() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # assert False is fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
# Pin the fixture loop scope: left unset, pytest-asyncio picks a default that
# changes between releases and leaks event loops across test modules.
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::RuntimeWarning"]

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true
